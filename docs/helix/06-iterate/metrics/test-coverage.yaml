name: test-coverage
description: >-
  Numeric Go statement-coverage packages that meet their committed package
  floors after the complete default test suite succeeds.
unit: package-ratio
direction: higher
command: go run scripts/coverage-ratchet.go
output_pattern: '^Packages: ([0-9]+)/([0-9]+) passing$'
baseline: 92/92 packages passing
target: all measured packages passing
tolerance: >-
  Per-package floor tolerance from .helix-ratchets/coverage-floor.json;
  default 2 percentage points.
last_verified: 2026-07-14
interpretation: >-
  A package passes when statement coverage is at least its exact or explicit
  wildcard floor minus tolerance. Any go test failure, parse failure, or
  zero-package measurement is an instrument error and returns exit code 2.
labels:
  language: go
  scope: github.com/easel/fizeau
  floor_source: .helix-ratchets/coverage-floor.json
  enforcement: make coverage-ratchet
