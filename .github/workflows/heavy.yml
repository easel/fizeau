# Heavy / expensive suites. NOT run on ordinary PRs.
# Triggers: release.yml (workflow_call; gates publishing), weekly schedule,
# dispatch, and PRs labelled `ci:full` (called from ci.yml). No `concurrency:`
# here on purpose: when called, the caller's group applies.
name: Heavy

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'  # weekly, Monday 05:00 UTC

permissions:
  contents: read

jobs:
  test-full:
    name: Full tests (race, gosec, govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install quality tools
        run: |
          make install-quality-tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Security scan
        run: make gosec

      - name: Vulnerability scan
        run: make govulncheck

      - name: Test (no race)
        run: make test-no-race

      - name: Test (race)
        run: make test-race

  portable-namespace-launcher:
    # experimental diagnostic: non-gating
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Verify portable namespace launcher artifacts
        run: make portable-namespace-launcher-check

  lifecycle-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Windows Job Object lifecycle
        run: go test ./internal/processlifecycle -run '^(TestWindowsJobKillOnOwnerHandleClose|TestWindowsJobReapsGrandchild|TestWindowsCleanupWaitsForZeroActiveProcesses)$' -count=1 -timeout=2m

      - name: Windows lifecycle package
        run: go test ./internal/processlifecycle -count=1 -timeout=2m

  website-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HUGO_VERSION: "0.160.0"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Hugo
        run: |
          wget -q https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i hugo_extended_${HUGO_VERSION}_linux-amd64.deb

      - name: Install Playwright Chromium
        run: npx --yes playwright install --with-deps chromium

      - name: Benchmark workbench smoke
        run: make benchmark-workbench-smoke

  adapter-pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install pytest
        run: python -m pip install --upgrade pytest

      - name: Adapter pytest
        run: make adapter-pytest

  install-sh-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install shell test dependencies
        run: bash tests/install_sh_acceptance.sh
