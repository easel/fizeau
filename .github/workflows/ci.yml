name: CI

# PR tier: one ubuntu job (build, vet, lint, fmt, import-boundary, fast tests,
# no race/gosec/govulncheck). Windows lifecycle, macOS install test, race tests,
# security scans, website smoke, adapter pytest and the zig launcher check live
# in heavy.yml: release (gates publishing), weekly, dispatch, or a PR labelled
# `ci:full`.
#
# Merge gate for heavy-suite code: `evidence-gate`. Run scripts/verify-full.sh
# locally and commit .ci/evidence/full-suite.json, or label the PR `ci:full`.
# Changes under internal/processlifecycle always need `ci:full` (Windows job
# cannot run locally).
#
# Branch protection: "test" is kept. Removed checks: portable-namespace-launcher,
# lifecycle-windows, website-smoke, adapter-pytest, install-sh-test (ubuntu-latest,
# macos-latest). New: evidence-gate. Docs-only PRs skip this workflow.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'demos/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Allow unprivileged user namespaces
        # Ubuntu 24.04 runners restrict unprivileged userns via AppArmor,
        # which blocks the portable-runtime offline launch probes.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install quality tools
        run: |
          make install-quality-tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Static checks
        run: |
          make build-ci
          make vet
          make contract004-import-lint
          make lint-go
          make fmt-check
          make rename-noise-check

      - name: Test
        run: make test-no-race

  full:
    name: Heavy suite (ci:full)
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full')
    uses: ./.github/workflows/heavy.yml

  # Cheap gate (seconds): proves the heavy suite was run for this exact tree.
  # Passes if (a) .ci/evidence/full-suite.json matches the PR head content hash
  # (produced by scripts/verify-full.sh), OR (b) PR has label `ci:full` and the
  # heavy job passed, OR (c) the diff touches no path the heavy suite covers.
  evidence-gate:
    name: evidence-gate
    if: always() && github.event_name == 'pull_request'
    needs: [full]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check evidence
        env:
          FULL_RESULT: ${{ needs.full.result }}
          BASE_REF: ${{ github.base_ref }}
          HEAVY_RE: '\.go$|^(go\.(mod|sum)|Makefile|scripts/|tests/|install|website/|bench/|eval/|cmd/|internal/)'
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD" | grep -Ev '^(scripts/verify-full\.sh|\.ci/evidence/)' || true)
          if ! grep -Eq "$HEAVY_RE" <<<"$changed"; then
            echo "No heavy-suite paths changed; gate passes."; exit 0
          fi
          if grep -Eq '^internal/processlifecycle/' <<<"$changed" && [[ "$FULL_RESULT" != "success" ]]; then
            echo "::error::internal/processlifecycle changes need the Windows lifecycle job: add the 'ci:full' label."; exit 1
          fi
          if [[ "$FULL_RESULT" == "success" ]]; then
            echo "ci:full label set and heavy suite passed; gate passes."; exit 0
          fi
          f=.ci/evidence/full-suite.json
          if [[ -f "$f" ]]; then
            want=$(jq -r .content_hash "$f")
            have=$(bash scripts/verify-full.sh --hash-only)
            if [[ "$want" == "$have" ]]; then
              echo "Evidence matches ($(jq -r '.suite + " @ " + .timestamp' "$f")); gate passes."; exit 0
            fi
            echo "::error::Evidence is stale (recorded $want, tree is $have). Re-run scripts/verify-full.sh and commit."
          else
            echo "::error::No $f. Run scripts/verify-full.sh and commit the evidence, or add the 'ci:full' label."
          fi
          exit 1
